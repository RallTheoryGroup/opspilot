name: OpsPilot CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep build --file infra/main.bicep
  ready:
    needs: [test, infra]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Tests and Bicep build passed"
