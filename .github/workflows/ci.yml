name: OpsPilot CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
  ready:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "Test job passed"
