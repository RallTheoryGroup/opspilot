name: OpsPilot CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: az bicep install
      - run: az bicep build -f infra/main.bicep
  ready:
    needs: [test, infra]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Tests and Bicep build passed"
